<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>正誤判定ページ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">
  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-xl font-bold text-center mb-4">ゲームマーケット2026春<br>WAOのチラシ謎</h1>

    <label for="answerInput" class="font-normal" >導き出される答えを入力してください。「LAST ANSWER」以外の判定も可能です。</label>
    <input id="answerInput" type="text"
      class="w-full mt-4 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 mb-4"
      placeholder="【答え】 を入力してください。">

    <button type="button"
      class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 rounded-lg transition"
      onclick="checkAnswer()">
      正誤判定
    </button>

    <div id="resultArea" class="mt-6 text-center font-bold text-lg"></div>

    <p class="mt-3 mb-4 text-blue-600 underline cursor-pointer text-center"
       onclick="window.open('hint.html', '_blank')">
      ヒントを見る
    </p>

  </div>
  <script>
    function checkAnswer() {
      const input = document.getElementById("answerInput").value.trim();
      const upper = input.toUpperCase();
      const resultArea = document.getElementById("resultArea");
      resultArea.innerHTML = "";

      // ADDRESS / アドレス
      if (upper === "ADDRESS" || input === "アドレス") {
        resultArea.innerHTML = `
          <p class="text-orange-500">正解です！<br>遊んで頂きありがとうございました！</p><br>
          <p class="text-brack">  ボードゲーム・謎解き制作団体WAO<br>両日出展 K37<br>よろしくお願い致します！</p>

          <img src="チラシ_解説.png"
               class="mx-auto mt-4 rounded-lg">

          <a href="https://twitter.com/intent/tweet?text=%E3%82%B2%E3%83%A0%E3%83%9E%E9%99%90%E5%AE%9A%E9%A0%92%E5%B8%83%E3%80%8EWAO%E3%81%AE4%E5%95%8F%E8%AC%8E%E3%80%8F%E3%82%92%E3%82%AF%E3%83%AA%E3%82%A2%E3%81%97%E3%81%9F%EF%BC%81%0A%0A%23WAO%E8%AC%8E%20%234%E5%95%8F%E8%AC%8E%0A%0Ahttps%3A%2F%2Fgamemarket.jp%2Fgame%2F188080"
             target="_blank"
             class="inline-block mt-4 px-4 py-2 bg-black text-white rounded-full hover:bg-blue-600 text-normal tracking-tight">
            結果を X でポストする
          </a>
        `;
        return;
      }

      // L → Aの謎
      if (upper === "L") {
        resultArea.textContent = "Aの謎正解です。";
        return;
      }

      // E → Bの謎
      if (upper === "E") {
        resultArea.textContent = "Bの謎正解です。";
        return;
      }

      // A → Cの謎
      if (upper === "A") {
        resultArea.textContent = "Cの謎正解です。";
        return;
      }

      // F → Dの謎
      if (upper === "F") {
        resultArea.textContent = "Dの謎正解です。";
        return;
      }

      // ACE / エース → SECRET正解
      if (upper === "ACE" || input === "エース") {
        resultArea.innerHTML = `
          <p class="text-purple-600">SECRET正解です。</p>
          <a href="https://twitter.com/intent/tweet?text=%E3%82%B2%E3%83%A0%E3%83%9E%E9%99%90%E5%AE%9A%E9%A0%92%E5%B8%83%E3%80%8EWAO%E3%81%AE4%E5%95%8F%E8%AC%8E%E3%80%8F%E3%81%AE%E5%85%A8%E3%81%A6%E3%81%AE%E8%AC%8E%E3%82%92%E8%A7%A3%E3%81%8D%E6%98%8E%E3%81%8B%E3%81%97%E3%81%9F%EF%BC%81%0A%0A%23WAO%E8%AC%8E%20%234%E5%95%8F%E8%AC%8E%0A%0Ahttps%3A%2F%2Fgamemarket.jp%2Fgame%2F188080"
             target="_blank"
             class="inline-block mt-4 px-4 py-2 bg-blue-500 text-white rounded-full hover:bg-blue-600">
            ポストする
          </a>
        `;
        return;
      }

      // 不正解
      resultArea.textContent = "何かが違うようです。";
    }
  </script>
</body>
</html>
